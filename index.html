<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembaca Bab</title><link rel="stylesheet" href="style.css?v=chapter-1"></head>
<body data-design="leather"><main class="app">
<header class="app-header"><div class="brand-mark">✦</div><div class="brand-title">PEMBACA BAB</div><button id="reading-mode" class="icon-button" type="button" aria-label="Buka reading mode" disabled>⛶</button></header>
<section class="editor-panel" aria-label="Sediakan bab">
<div class="field title-field"><label for="chapter-title">Tajuk bab</label><input id="chapter-title" maxlength="100" autocomplete="off"></div>
<div class="field content-field"><label for="chapter-content">Isi bab</label><textarea id="chapter-content" placeholder="Pisahkan setiap perenggan dengan satu baris kosong."></textarea><small>2–4 perenggan akan diletakkan pada setiap halaman.</small></div>
<div class="settings-row">
<label>Reka bentuk<select id="design-choice"><option value="leather">Kulit klasik</option><option value="parchment">Manuskrip</option><option value="midnight">Midnight ink</option></select></label>
<label>Saiz tajuk <input id="title-size" type="range" min="26" max="68" value="42"><output id="title-value">42</output></label>
<label>Saiz isi <input id="text-size" type="range" min="13" max="23" value="17"><output id="text-value">17</output></label>
<button id="build-book" type="button">Bina bab</button>
</div>
<p id="editor-message" class="editor-message" aria-live="polite"></p>
</section>
<section id="book-stage" class="book-stage" hidden><span class="edge-note" aria-hidden="true">SELAK ›</span><div id="book" aria-label="Buku"></div></section>
<nav class="controls" aria-label="Navigasi halaman" hidden><button id="previous-page" type="button">← Sebelum</button><div class="page-status">Halaman <b id="current-page">1</b> / <b id="page-count">1</b><i><em id="reading-progress"></em></i></div><button id="next-page" type="button">Seterusnya →</button></nav>
<p class="hint" hidden>Gunakan butang, seret hujung halaman, atau kekunci anak panah untuk menyelak.</p>
</main><button id="exit-reading" type="button" aria-label="Keluar dari reading mode">×</button><script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script src="seribu-satu-malam.js?v=chapter-1"></script></body></html>
